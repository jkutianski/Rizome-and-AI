name: Validate agent assets

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run projection tests
        run: python -m unittest discover -s IA/scripts/tests -v

      - name: Check generated agent assets
        run: python IA/scripts/sync-agent-skills.py --check

      - name: Validate repository integrity
        run: python IA/scripts/validate-repository.py